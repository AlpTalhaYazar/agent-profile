version: 1
env:
  NODE_ENV: "development"
  DB_POOL_SIZE: "10"
settings:
  theme: "light"
mcpServers:
  github:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${secret:github.pat}"
  postgres:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env:
      DATABASE_URL: "${secret:postgres.connection}"
