version: 1
env:
  DATABASE_URL: "postgres://${secret:pg.user}:${secret:pg.pw}@host/db"
  PLAIN_VAR: "no-secrets-here"
mcpServers:
  github:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${secret:github.pat}"
  postgres:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env:
      HOST: "${env:POSTGRES_HOST}"
      PORT: "5432"
  figma:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-figma"]
    env:
      TOKEN: "keyring://figma/work"
settings: {}
